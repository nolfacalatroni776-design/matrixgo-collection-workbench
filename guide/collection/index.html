<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>同一场测评，两种出卷方式 · 采集工作流</title><style>
:root{--ink:#202b2a;--dim:#505e59;--paper:#faf8f2;--line:#d8d9d0;--static:#23604f;--dynamic:#69403f;--mint:#dbefe3;--rose:#f6e1da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{width:min(1180px,94%);margin:0 auto 3rem}header{border-bottom:1px solid var(--ink);padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}header b{letter-spacing:.06em}.mono,.tag,.no{font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.08em}.intro{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:28px;margin:30px 0 22px}h1{font-size:clamp(30px,4.1vw,58px);line-height:1.13;letter-spacing:-.055em;margin:5px 0 9px}p{margin:0}.intro p,.foot,.sub{color:var(--dim)}.relation{background:#eeeee6;padding:17px 20px;border-left:3px solid #756d4f;border-radius:0 8px 8px 0}.relation b{font-size:17px}.relation p{font-size:14px;margin-top:4px}.player{border:1px solid var(--line);border-radius:16px;background:#fffefa;padding:18px;box-shadow:0 4px 0 #e4e3da}button{font:inherit;cursor:pointer;border:1px solid #babfb5;background:white;color:var(--ink);border-radius:7px;padding:6px 12px}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #d79d3a;outline-offset:2px}.bar,.controls,.person{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:13px}.play{background:var(--ink);color:white;border-color:var(--ink);min-width:100px}.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.phase button{border:0;border-top:3px solid #d8dbd1;border-radius:0;text-align:left;background:none;font-size:14px}.phase button[aria-current=step]{border-color:#253d34;font-weight:750;background:#f0f3ea}.phase b{font:11px monospace;margin-right:5px}.caption{padding:14px 4px 0;font-size:16px;min-height:45px}.caption strong{color:#294b3d}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.lane{--accent:var(--static);--wash:var(--mint);border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.lane.dynamic{--accent:var(--dynamic);--wash:var(--rose)}.lanehead{background:var(--wash);padding:15px 18px 13px;display:flex;align-items:center;gap:12px}.lanehead h2{margin:0;font-size:21px;color:var(--accent)}.sig{border:1px solid var(--accent);color:var(--accent);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font:700 19px Georgia,serif}.lanehead p{font-size:13px}.zone{margin:12px 15px;padding:12px 14px;background:#f8f8f5;border:1px solid #e0e2da;border-radius:10px;min-height:74px}.zone.focus{border-color:var(--accent);background:var(--wash)}.label{font-size:12px;color:var(--accent);font-weight:700;display:block}.tokens{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}.chip{display:inline-flex;align-items:center;border:1px solid #bfcac1;border-radius:5px;padding:2px 7px;background:#fff;font-size:13px;line-height:1.55}.chip b{color:var(--accent);font:700 11px monospace;margin-right:5px}.note{font-size:13px;color:var(--dim);margin-top:5px}.packet{font-size:14px;margin-top:6px;border-left:2px solid var(--accent);padding:3px 9px;background:#ffffffa8}.packet .tokens{display:inline-flex;vertical-align:middle}.dim{opacity:.8}.person{font-size:13px;border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}.person button{font-size:13px}.person button[aria-pressed=true]{background:#263e35;color:white}.readout{font-size:13px;color:var(--dim)}.defs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:27px}.defs div{border-top:1px solid #89928a;padding-top:8px;font-size:13px}.defs b{display:block;font-size:16px}.foot{margin-top:16px;font-size:12px}.ghost{position:fixed;z-index:8;pointer-events:none;box-shadow:0 4px 12px #203b2725;background:#fffbe7}.topic{font-size:12px;color:var(--dim)}@media(max-width:760px){.intro{grid-template-columns:1fr;gap:16px}.lanes{grid-template-columns:1fr}.defs{grid-template-columns:1fr 1fr}.phase button{padding:6px 3px}.phase b{display:block}.player{padding:12px}.bar .mono{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet{background:repeating-linear-gradient(#fff 0px,#fff 27px,#e4eaf1 28px);border:1px solid #b5c4bd;border-radius:3px;padding:12px 15px;margin:6px 0;box-shadow:2px 3px 0 #d5ded5}.sheet-head,.qa{display:flex;align-items:center;gap:.55em;margin:.25em 0}.sheet-head{justify-content:space-between}.sheet-head span,.qa>span{font-size:13px}.qa em{font:italic 22px Georgia,serif;color:#23538b}.qa i{color:#9aaba8;font-size:12px}.key{margin:24px 0}.key summary{cursor:pointer;font-weight:bold}.key .defs{margin-top:12px} .intro{margin:26px 0 16px}.intro h1{font-size:clamp(28px,3.8vw,50px)}.lanes{align-items:start}.lane{padding-bottom:12px}.flow{list-style:none;padding:0 16px;margin:14px 0 0}.flow li{position:relative;padding:0 0 17px 34px}.flow li:not(:last-child):before{content:"";position:absolute;top:24px;bottom:1px;left:11px;border-left:2px solid #c7d1c9}.flow li:not(:last-child):after{content:"▾";position:absolute;bottom:-3px;left:6px;color:#708276;font-size:16px}.flow li:last-child{padding-bottom:0}.n{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--wash);color:var(--accent);display:grid;place-items:center;font:700 12px monospace}.flow h3{margin:0;font-size:17px}.flow li p{font-size:14px;color:#56625e;margin:2px 0 5px}.eg{font-size:14px;border-left:2px solid var(--accent);background:#f6f7f3;padding:5px 10px}.flow li.on .eg{background:var(--wash)}.flow li.on .n{background:var(--accent);color:white}.flow li.on h3{color:var(--accent)}.flow .eg span{display:block}.player{padding:14px}.bar{margin:0}.guide-note{font-size:14px;color:var(--dim)}.intro{grid-template-columns:1fr}.lanehead p{font-size:14px}.foot{margin-top:12px}@media(max-width:760px){.flow{padding:0 12px}.intro{margin:16px 0}.bar{gap:9px}} </style><main><header><b>MatrixGo　/　采集图解</b><span>工作流说明</span></header><section class="intro"><div><h1>用一张试卷，看懂两种组题流程</h1><p>以库存盘点测评为例：两个人各做一道计算题、一道简答题。静态先定好具体是哪两道题；动态先定每类出几道，再从题库里选。</p></div></section><section class="player"><div class="bar"><b>从上到下看完整流程 ↓</b><div class="controls"><span id="progress" class="guide-note" aria-live="polite">两条流程均已展开</span><button class="play" id="play">▶ 逐步高亮</button></div></div><div class="lanes" id="lanes"></div></section><p class="foot">每列都是一次独立的发卷示例。实际采集时，卷上的答案也可以换成一段录音、一张照片或一份表单。</p></main><script>
const tracks=[{mode:'静态数据',how:'一张样卷，多人按同样的题序作答。',rows:[
['准备题目','题目定义要做什么，可以反复使用。','计算 A：账面 80 件，实盘 76 件，少了几件？','简答 B：发现少货，怎么核实？'],
['排成固定脚本','脚本相当于一张样卷，写明有哪些题、按什么顺序做。','固定样卷：① 计算 A　② 简答 B'],
['设置这张样卷可以发几份','发放数量是这份脚本可以被领取的次数。此时有样卷，还没有谁的个人答卷。','可领取 2 次，每人限领 1 次'],
['领取时，生成一份个人数据','采集任务节点（Job）是领取和交卷的环节。每有人领取一次，就按样卷生成一条独立的采集数据（Task）。','林宁领到：A ＋ B','周敏领到：A ＋ B'],
['作答并提交','每道题的作答分别记录为单题结果（Subtask），归在本人的那份数据下。','林宁：4 件；先复盘数量，再核对库位。','周敏：4 件；重新清点，再查出库单。']
]},{mode:'动态数据',how:'先定出题规则，提前组好试卷，再供人领取。',rows:[
['把候选题放进题库','主题用来给题目分组。题库是可供选择的题目集合，还不是可以领的试卷。','计算主题：A 库存差额','简答主题：B 核实少货、C 排查重复入库'],
['设定组卷规则','规则指定每份从哪些主题各取几道，以及这次要生成几份。','每份：计算 1 道 ＋ 简答 1 道；共 2 份'],
['按规则生成数据，放入领取池','领取池里放的是已经组好的试卷。不同卷可以有相同的题，也可能整份相同。','本次组合示例：卷 01＝A ＋ B','卷 02＝A ＋ C'],
['领取已有的一份数据','采集员在采集任务节点（Job）领取一条数据（Task）。领走的是上一步组好的那份，无需当场再抽题。','林宁领卷 01：A ＋ B','周敏领卷 02：A ＋ C'],
['作答并提交','每份试卷保留自己的单题结果（Subtask）。即使两人做了同一道计算题，答案也各自归档。','林宁：4 件；先复盘数量，再核对库位。','周敏：4 件；按入库单号查重，再核对实收数量。']
]}];document.getElementById('lanes').innerHTML=tracks.map((t,k)=>`<article class="lane ${k?'dynamic':'static'}"><div class="lanehead"><span class="sig" aria-hidden="true">${k?'D':'S'}</span><div><h2>${t.mode}</h2><p>${t.how}</p></div></div><ol class="flow">${t.rows.map(([title,desc,...ex],i)=>`<li data-row="${i}"><span class="n" aria-hidden="true">${i+1}</span><h3>${title}</h3><p>${desc}</p><div class="eg">${ex.map(x=>`<span>${x}</span>`).join('')}</div></li>`).join('')}</ol></article>`).join('');let step=-1,timer=null;const btn=document.getElementById('play'),statusText=document.getElementById('progress');function show(){document.querySelectorAll('[data-row]').forEach(e=>e.classList.toggle('on',+e.dataset.row===step));statusText.textContent=step===-1?'两条流程均已展开':`第 ${step+1} / 5 步：${['题目来源','确定题单','领取前','领取时','提交后'][step]}`;btn.textContent=timer?'Ⅱ 暂停':step===4?'↺ 重新高亮':step===-1?'▶ 逐步高亮':'▶ 继续高亮'}function stop(){clearInterval(timer);timer=null}btn.onclick=()=>{if(timer){stop();show();return}if(step===4||step===-1)step=0;timer=setInterval(()=>{step++;if(step===4)stop();show()},2400);show()};
</script></html>
